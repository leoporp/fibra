<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibra</title>
<meta name="description" content="Rutina terapéutica para epicondilitis: sesiones guiadas, registro de dolor y recompensas.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF0EB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131615">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fibra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2-variations"),url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2")}
:root{
  --bg:#EEF0EB; --surface:#FFFFFF; --ink:#1F1B19; --muted:#69625D; --line:#DCD8D1;
  --accent:#9A3F27; --accent-ink:#FFFFFF; --soft:#F4E4DC; --fiber:#B8741E; --cue:#3D7C83; --warn:#C4161C; --warn-soft:#FBE3E1; --armL:#2A6FB0; --armR:#9A3F27;
  --body:#3A4048;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body-font:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --surface:#1C201F; --ink:#ECE7E3; --muted:#A49D97; --line:#303634;
    --accent:#E58A68; --accent-ink:#1B0E09; --soft:#3A2722; --fiber:#E8B25E; --cue:#7FC4CA; --warn:#FF7B72; --warn-soft:#3B1F1E; --armL:#4A90E2; --armR:#DB6F4C;
    --body:#C9CED3;
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1C201F; --ink:#ECE7E3; --muted:#A49D97; --line:#303634;
  --accent:#E58A68; --accent-ink:#1B0E09; --soft:#3A2722; --fiber:#E8B25E; --cue:#7FC4CA; --warn:#FF7B72; --warn-soft:#3B1F1E; --armL:#4A90E2; --armR:#DB6F4C;
  --body:#C9CED3;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:none}
/* fiber identity */
.fx-on{stroke:var(--accent);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fx-half{stroke:var(--accent);opacity:.45;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fx-off{stroke:var(--line);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fx-amb{stroke:var(--fiber);fill:none;stroke-linecap:round;stroke-linejoin:round}
/* movimiento: respuesta a lo que haces, con la identidad de las hebras */
:root{--e-out:cubic-bezier(.22,1,.36,1);--e-spring:cubic-bezier(.34,1.4,.64,1);--t1:140ms;--t2:240ms;--t3:420ms}
.bundle path,.strands path{transition:d .75s var(--e-out),stroke .5s var(--e-out),stroke-width .5s var(--e-out),opacity .5s}
.bundle .sheen{fill:none;stroke:#FFF6EF;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.14 1;stroke-dashoffset:.14;opacity:0}
.celebrate .sheen{animation:sheen 1s var(--e-out) calc(.5s + var(--i)*80ms) both}
@keyframes sheen{0%{opacity:.95;stroke-dashoffset:.14}100%{opacity:0;stroke-dashoffset:-1}}
.celebrate .fx-on{animation:fpulse .7s var(--e-spring) calc(.25s + var(--i)*80ms) both}
@keyframes fpulse{45%{stroke-width:6.5}}
.celebrate p{animation:swapin .5s var(--e-out) .5s both}
.bundle{margin:-4px 0 18px}
.bundle svg{display:block;width:100%;height:auto}
.bundle p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.strands{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 8px}
.strands .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.strands svg{width:28px;height:56px;display:block}
.strands .today span{color:var(--ink);font-weight:700}
.strands .today .fx-off{stroke:var(--muted);opacity:.6}
.strands .future .fx-off{opacity:.45;stroke-dasharray:2 5}
.tstrand{display:block;width:100%;height:24px;margin:-2px 0 10px}
.tstrand path{vector-effect:non-scaling-stroke}
.lbl{display:block;font-weight:700;margin-bottom:8px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px;font-weight:700;color:var(--muted)}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;font-size:13px;line-height:1.15;color:var(--muted);min-height:46px}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.savebar .dirty{color:var(--accent);font-weight:700}
.linkish{background:none;border:0;padding:2px 0;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.srow .linkish{flex:1;min-width:0;font-size:15px}
.dots .pair{display:inline-flex;gap:3px;margin-right:6px}
.dots .pair i{width:11px;height:11px}
.habits{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.hrow{display:grid;grid-template-columns:62px repeat(28,1fr);gap:2px;align-items:center;margin-bottom:6px}
.hrow span{font-size:12px;color:var(--muted)}
.hrow i{display:block;height:14px;border-radius:3px;background:var(--line);opacity:.6}
.hrow i.on{background:var(--accent);opacity:1}
.hrow i.na{background:transparent;border:1px dashed var(--muted);opacity:.6}
.hrow i.l1{background:var(--accent);opacity:.2}.hrow i.l2{background:var(--accent);opacity:.4}.hrow i.l3{background:var(--accent);opacity:.6}.hrow i.l4{background:var(--accent);opacity:.8}.hrow i.l5{background:var(--accent);opacity:1}
.fund{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fiber);border-radius:14px;padding:14px}
.fundtop{display:flex;align-items:baseline;gap:8px}
.fundtop b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.fundtop b.neg{color:var(--warn)}
.spends{margin-top:10px;border-top:1px solid var(--line)}
.spend{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.spend .sa{display:flex;align-items:center;gap:4px;flex:none}
.next.fundline{border-left-color:var(--fiber)}
.segs.two{grid-template-columns:1fr 1fr;margin-bottom:8px}
.chart .legend svg{display:inline-block;width:26px;height:10px;vertical-align:0;margin-right:6px}
.chart .legend span{white-space:nowrap}
.pday{margin:8px 0 0;color:var(--ink);min-height:2.6em}
.anchor{margin:4px 0 0;font-size:14px;line-height:1.35;color:var(--ink);min-height:2.7em}
.pr.unset .anchor{color:var(--muted)}
.hint{margin:10px 0 0}
.hint .linkish{font-size:14px;color:var(--ink)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.gl{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.gl:last-child{border-bottom:0}
.gl b{flex:none;min-width:2.2em;font-family:var(--display);font-size:18px;color:var(--muted)}
.gl.key b{color:var(--accent)}
.pill.play{display:block;margin:0 0 10px;background:var(--soft);border-left:3px solid var(--fiber);border-radius:8px;padding:8px 10px;font-weight:700}
.regmini{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px}
.regmini b{display:block;font-size:15px;margin-bottom:2px}
.chklist{display:flex;flex-direction:column;gap:6px}
.chkrow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:15px}
.chkrow .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center}
.chkrow.on{border-color:var(--accent)}
.chkrow.on .box{background:var(--accent);border-color:var(--accent)}
.chkrow.on .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chkrow.on span:last-child{color:var(--muted);text-decoration:line-through}
.warm{margin:0;padding-left:22px}
.warm li{margin:0 0 8px;font-size:15px}
.repctl{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.repctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px}
.repctl b{font-family:var(--display);font-size:40px;font-weight:800;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.repctl span{color:var(--muted);font-size:15px;flex:1;text-align:right}
.loadline{margin:0 0 4px}
.lastline{margin:0 0 8px}
.loadedit{display:flex;gap:8px;margin:0 0 8px}
.loadedit input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
/* respuesta al tacto */
.btn,.chip,.tog,.seg,.stepper button,.repctl button,.sbtns button,.next,.thumb{transition:transform var(--t1) var(--e-out),background-color var(--t2) var(--e-out),border-color var(--t2) var(--e-out),color var(--t2) var(--e-out),opacity var(--t2)}
.btn:active,.chip:active,.tog:active,.seg:active,.stepper button:active,.repctl button:active,.sbtns button:active{transform:scale(.95)}
.dayrow,.chkrow,.ex{transition:transform var(--t1) var(--e-out),border-color var(--t2) var(--e-out),background-color var(--t2) var(--e-out)}
.dayrow:active,.chkrow:active,.next:active,.ex:active{transform:scale(.985)}
.ex.juston{animation:exfill .5s var(--e-out)}
.ex.juston .ck{animation:ckpop .5s var(--e-spring)}
@keyframes exfill{from{background:var(--surface);border-color:var(--line)}}
@keyframes ckpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.dots i{transition:background-color var(--t2) var(--e-out)}
.dots i.new{animation:dotpop .45s var(--e-spring)}
@keyframes dotpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
#rep-n.bump{animation:bump .28s var(--e-spring)}
@keyframes bump{50%{transform:scale(1.18)}}
.regin .pain{animation:swapin var(--t3) var(--e-out) both}
.chkrow .box{transition:background-color var(--t2) var(--e-out),border-color var(--t2) var(--e-out)}
.chkrow.on .box{animation:ckpop .4s var(--e-spring)}
.days{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.dayrow b{display:block;font-size:15px}
.dayrow .go{flex:none;color:var(--accent);font-weight:700}
.dayrow.on{border-left-color:var(--accent)}
.sessmeta{margin:-6px 0 12px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){
  :root{--t1:1ms;--t2:1ms;--t3:1ms}
  *,*::before,*::after{animation-duration:1ms !important;animation-delay:0s !important;transition-duration:1ms !important;transition-delay:0s !important}
}
.sync{font-size:13px;color:var(--muted)}
button.sync{background:none;border:0;padding:8px 0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-align:right}
.next.cloud{border-left-color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.08;letter-spacing:-.025em;margin:4px 0 16px}
h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:30px 0 10px}
.date{color:var(--muted);margin:10px 0 0;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:14px}
section{margin-bottom:6px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.d i{display:block;width:100%;max-width:40px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.d.half i::after,.d.full i::after{content:"";position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.d.half i::after{height:50%;opacity:.55}
.d.full i::after{height:100%}
.d.today span{color:var(--ink);font-weight:700}
.d.today i{border-color:var(--ink)}
.d.future i{opacity:.45}
.d.pop i::after{animation:fill .6s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{height:0}}

/* next reward */
.next{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fiber);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:15px}
.next.ready{background:var(--soft);border-color:var(--fiber)}

/* session chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:-2px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;color:var(--muted)}
.chip b{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on b{color:var(--bg)}

/* exercises */
.ex{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ex.on{border-color:var(--accent);background:var(--soft)}
.exmain{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;padding:14px 12px 14px 14px}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.ex.on .ck{background:var(--accent);border-color:var(--accent)}
.ex.on .ck::after{content:"";width:8px;height:14px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.nm{font-weight:700;display:block}
.rx{display:block;color:var(--muted);font-size:15px}
.thumb{flex:none;width:100px;border:0;border-left:1px solid var(--line);background:var(--bg);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px}
.thumb svg,.thumb img{width:100%;height:auto;display:block;border-radius:6px}
.thumb img{aspect-ratio:22/15;object-fit:cover}
.thumb .ph{font-size:13px;line-height:1.2;text-align:center;padding:4px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-top:6px}
.tag.pend{border-color:var(--fiber);color:var(--fiber)}

/* illustrations */
.ill{display:block;width:100%;height:auto}
.ill .bd{stroke:var(--body);stroke-linecap:round;stroke-linejoin:round;fill:none}
.ill .bdf{fill:var(--body)}
.ill .bdl{stroke:var(--body);opacity:.3;stroke-linecap:round;fill:none}
.ill .bdlf{fill:var(--body);opacity:.3}
.ill .sup{fill:var(--line)}
.ill .eq{stroke:var(--accent);stroke-linecap:round;fill:none}
.ill .eqp{fill:var(--soft);stroke:var(--accent);stroke-width:4}
.ill .band{stroke:var(--accent);stroke-width:3;stroke-linecap:round;fill:none}
.ill .mv{stroke:var(--cue);stroke-width:2.5;fill:none;stroke-dasharray:3 6;stroke-linecap:round}
.ill .mvh{stroke:var(--cue);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill .fing{stroke:var(--body);fill:none;stroke-dasharray:30 3}
.ill .ring{stroke:var(--line);fill:none;stroke-width:5}
.ill .ringp{stroke:var(--fiber);fill:none;stroke-width:5;stroke-linecap:round}
.ill .tx{fill:var(--muted);font:700 11px var(--body-font)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.stage .ill{max-height:42vh;margin:0 auto}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 4px}
.phase{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;margin:0;min-height:2.4em;display:flex;align-items:center}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.flow p{margin:0 0 8px}
.donechip{display:inline-flex;align-items:center;font-weight:700;color:var(--accent);padding:0 6px}
.startbtn{margin-bottom:12px}
.sets{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.tmr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 10px}
.tmr b{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tmr span{color:var(--muted);font-size:15px}
.tbar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:12px}
.tbar span{display:block;height:100%;background:var(--fiber);border-radius:99px}
.flow.rest{border-color:var(--fiber)}
.nudge{background:var(--soft);border-left:4px solid var(--fiber);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:15px}
.tag.go{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 12px;font-size:14px;margin:4px 0 0}

/* pain */
.pain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.pr{padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr label{display:flex;justify-content:space-between;font-weight:700}
.pr output{font-family:var(--display);font-weight:800;font-size:20px;min-width:2ch;text-align:right}
.pr.unset output{color:var(--muted);font-weight:500;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.pr.unset input[type=range]{opacity:.45}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-2px}
textarea.note{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px;resize:vertical}
.alert{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.icon-btn{background:none;border:0;color:var(--muted);padding:10px 6px;min-height:40px;font-size:14px;text-decoration:underline}

/* progress */
.fibers{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px}
.fibers svg{width:100%;height:auto;display:block}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px}
.lvl b{font-family:var(--display);font-size:24px;letter-spacing:-.02em;line-height:1.1}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--fiber);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.chart svg{width:100%;height:auto;display:block}
.chart .tx{fill:var(--muted);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.insight{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rw .st{font-size:13px;color:var(--muted)}
.rw.ready{border-color:var(--fiber);background:var(--soft)}
.rw.ready .st{color:var(--fiber);font-weight:700}
.rw.claimed{opacity:.6}
.rw .act{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}

/* routine */
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exrow{display:flex;gap:12px;align-items:flex-start}
.exrow .thumb{width:84px;border:1px solid var(--line);border-radius:10px}
.exrow > div{flex:1;min-width:0}
.sl{margin:8px 0 0;padding-left:22px}
.sl li{margin:3px 0}
.hist{font-size:14px;color:var(--muted);margin-top:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px}
textarea.out{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-size:15px;resize:vertical}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.stepper b{font-family:var(--display);font-size:26px;min-width:2ch;text-align:center}

/* media */
.media{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.media figure.vid{grid-column:1 / -1}
.media img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line)}
.media video{display:block;width:100%;max-height:60vh;background:#000}
.media figcaption{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 2px 10px;font-size:13px;color:var(--muted)}
.upl{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:1.2em}
.upl.err{color:var(--warn)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs div{position:relative}
.tabs .ind{position:absolute;top:0;left:0;width:calc(100% / 3);height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(calc(var(--ti, 0) * 100%));transition:transform var(--t3) var(--e-spring)}
.tabs button{background:none;border:0;padding:9px 0 11px;font-weight:700;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color var(--t2) var(--e-out)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--t2)}
.tabs svg circle{fill:currentColor;stroke:none}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}
.tabs button[aria-current="page"] svg circle{fill:var(--accent)}
.tabs button.pop svg path{animation:drawp .6s var(--e-out) both}
.tabs button.pop svg path:nth-child(2){animation-delay:60ms}.tabs button.pop svg path:nth-child(3){animation-delay:120ms}
@keyframes drawp{from{stroke-dasharray:1 1;stroke-dashoffset:1}to{stroke-dasharray:1 1;stroke-dashoffset:0}}
/* cambio de pestaña */
#view{view-transition-name:view}
.tabs{view-transition-name:tabs}
.top{view-transition-name:top}
::view-transition-group(view){animation-duration:0s}
::view-transition-old(root),::view-transition-new(root),::view-transition-old(tabs),::view-transition-new(tabs),::view-transition-old(top),::view-transition-new(top){animation:none}
::view-transition-old(view){animation:vtOutL 160ms var(--e-out) both}
::view-transition-new(view){animation:vtInR 320ms var(--e-out) both}
html[data-vt=back]::view-transition-old(view){animation-name:vtOutR}
html[data-vt=back]::view-transition-new(view){animation-name:vtInL}
@keyframes vtOutL{to{opacity:0;transform:translateX(-24px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(28px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(24px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-28px)}}
/* al entrar a Progreso */
#view.enter .bar span{animation:growx 1s var(--e-out) .1s both;transform-origin:left}
#view.enter .revealr{animation:growx 1.1s var(--e-out) .15s both;transform-box:fill-box;transform-origin:left}
#view.enter .sbar{animation:growy .6s var(--e-out) both;transform-box:fill-box;transform-origin:bottom}
#view.enter .fibers path{animation:fadein .6s var(--e-out) both}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes fadein{from{opacity:0}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,0);z-index:10;display:flex;align-items:flex-end;justify-content:center;transition:background-color var(--t2) var(--e-out)}
.scrim.open{background:rgba(10,14,20,.5)}
.scrim:not(.open){pointer-events:none}
.scrim .sheet{transform:translateY(105%);transition:transform var(--t3) var(--e-out);will-change:transform}
.scrim.open .sheet{transform:none}
.scrim.drag .sheet{transition:none}
.sheet.swap > *{animation:swapin var(--t2) var(--e-out) both}
.sheet.swap > .grab{animation:none}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet h3{font-family:var(--display);font-size:24px;line-height:1.15;margin:0}
.sheet h4{font-family:var(--display);font-size:18px;margin:22px 0 8px}
.sheet p{margin:0 0 8px}
.f{display:block;margin-bottom:14px}
.f > span{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=number],.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface)}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:15px}
.sbtns{display:flex;gap:4px;flex:none}
.sbtns button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.sbtns button:disabled{opacity:.35}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px) scale(.96);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity var(--t2) var(--e-out), transform var(--t3) var(--e-spring);z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px)}
.toast.top.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  .d.pop i::after{animation:none}
  .toast{transition:none}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const uid = () => Math.random().toString(36).slice(2,10);
const fmtShort = k => parseKey(k).toLocaleDateString("es-CO",{day:"numeric",month:"short"});
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } };
const DAYS = ["L","M","M","J","V","S","D"];
const ZONES = ["Antebrazo","Muñeca","Agarre y dedos","Tríceps","Hombro","Otro"];
const LEVELS = ["Fibras desordenadas","Primeras hebras","Hebras alineándose","Colágeno nuevo","Tendón que tolera","Tendón que responde","Antebrazos de pianista","Agarre de motero","Tendón de acero"];
const LS_KEY = "fibra-state-v1";
const MB = 1024*1024;

/* ---------- illustrations ---------- */
const D2R = Math.PI/180;
const f1 = n => Math.round(n*10)/10;
const P = (o, ang, len) => [o[0] + len*Math.cos(ang*D2R), o[1] + len*Math.sin(ang*D2R)];
const lerp = (a,b,p) => a + (b-a)*p;
const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;
const sw = w => w ? ' stroke-width="'+w+'"' : '';
const Ln = (a,b,cls,w) => '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" class="'+cls+'"'+sw(w)+'/>';
const Ci = (c,r,cls) => '<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="'+f1(r)+'" class="'+cls+'"/>';
const El = (c,rx,ry,cls) => '<ellipse cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" class="'+cls+'"/>';
const Rc = (x,y,w,h,r,cls) => '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" class="'+cls+'"/>';
const Pl = (pts,cls,w) => '<polyline points="'+pts.map(p => f1(p[0])+","+f1(p[1])).join(" ")+'" class="'+cls+'"'+sw(w)+'/>';
const head = (tip, dir) => { const h1 = P(tip,dir+150,9), h2 = P(tip,dir-150,9); return '<path d="M'+f1(h1[0])+' '+f1(h1[1])+' L'+f1(tip[0])+' '+f1(tip[1])+' L'+f1(h2[0])+' '+f1(h2[1])+'" class="mvh"/>'; };
function arcPath(c,r,a0,a1,cls,w){
  const s = P(c,a0,r), e = P(c,a1,r), large = Math.abs(a1-a0) > 180 ? 1 : 0, sweep = a1 > a0 ? 1 : 0;
  return '<path d="M'+f1(s[0])+' '+f1(s[1])+' A'+r+' '+r+' 0 '+large+' '+sweep+' '+f1(e[0])+' '+f1(e[1])+'" class="'+cls+'"'+sw(w)+'/>';
}
function arrowFor(c,r,aFrom,aTo,dir){
  if (!dir) return arcPath(c,r,aFrom,aTo,"mv");
  const a0 = dir > 0 ? aFrom : aTo, a1 = dir > 0 ? aTo : aFrom;
  return arcPath(c,r,a0,a1,"mv") + head(P(c,a1,r), a1 + (a1 > a0 ? 90 : -90));
}
function lineArrow(a,b){ return Ln(a,b,"mv") + head(b, Math.atan2(b[1]-a[1], b[0]-a[0])/D2R); }
function seg(t, segs, dur){
  for (const s of segs) if (t >= s.a && t < s.b){ const k = (t - s.a)/(s.b - s.a); return {p: lerp(s.from, s.to, s.lin ? k : ease(k)), s, k, secs: (s.b - s.a)*dur}; }
  const s = segs[segs.length-1]; return {p: s.to, s, k: 1, secs: (s.b - s.a)*dur};
}
const count = (k, secs, max) => Math.min(max, Math.floor(k*secs)+1);
const FING = ["el índice","el medio","el anular","el meñique"];

const forearmBase = () => Rc(8,88,122,18,9,"sup") + Ln([26,76],[118,76],"bd",16);
const WR = [122,76];
const wristHand = a => { const F = P(WR,a,24), d = a + 115, n = P(F,d,14), f = P(F,d+180,14);
  return Ci(f,9,"eqp") + Ln(f,n,"eq",5) + Ln(WR,F,"bd",16) + Ci(n,11,"eqp"); };
const standing = () => Ci([58,18],11,"bdf") + Rc(44,32,30,88,12,"sup") + Ln([52,122],[50,150],"bdl",10) + Ln([66,122],[68,150],"bdl",10);
const std4 = (go, top, back, rest) => [
  {a:0,b:.32,from:0,to:1,txt:go},{a:.32,b:.42,from:1,to:1,txt:top},{a:.42,b:.9,from:1,to:0,txt:back},{a:.9,b:1,from:0,to:0,txt:rest}];

const ART = {
  ecc_ext: { name:"Excéntrico de extensores", dur:7, thumbT:.4, note:"Palma hacia abajo",
    segs:[{a:0,b:.08,from:0,to:0,txt:"Arriba"},
          {a:.08,b:.7,from:0,to:1,lin:true,txt:(k,s)=>"Baja lento: "+count(k,s,4)},
          {a:.7,b:.78,from:1,to:1,txt:"Abajo"},
          {a:.78,b:1,from:1,to:0,txt:"Sube con ayuda de la otra mano"}],
    draw:(p,dir) => forearmBase() + arrowFor(WR,52,-35,45,dir) + wristHand(lerp(-35,45,p)) },
  iso_ext: { name:"Isométrico de extensores", dur:6, thumbT:.6, note:"Palma hacia abajo",
    segs:[{a:0,b:1,from:0,to:0,lin:true,txt:"Sostén la muñeca recta, sin moverla"}],
    draw:(p,dir,o) => { const c = [186,30], r = 17, circ = 2*Math.PI*r;
      return forearmBase() + lineArrow([135,30],[135,50]) + wristHand(0) +
        Ci(c,r,"ring") + '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+r+'" class="ringp" stroke-dasharray="'+f1(o.t*circ)+' '+f1(circ)+'" transform="rotate(-90 '+c[0]+' '+c[1]+')"/>' +
        (o.thumb ? '' : '<text x="'+c[0]+'" y="'+(c[1]+4)+'" text-anchor="middle" class="tx">30 s</text>'); } },
  flex: { name:"Flexores de muñeca", dur:6, thumbT:.3, note:"Palma hacia arriba",
    segs:[{a:0,b:.1,from:0,to:0,txt:"Abajo"},{a:.1,b:.42,from:0,to:1,txt:"Sube"},{a:.42,b:.5,from:1,to:1,txt:"Arriba"},
          {a:.5,b:1,from:1,to:0,lin:true,txt:(k,s)=>"Baja despacio: "+count(k,s,3)}],
    draw:(p,dir) => forearmBase() + arrowFor(WR,52,40,-40,dir) + wristHand(lerp(40,-40,p)) },
  prosup: { name:"Pronación y supinación", dur:5, thumbT:.2, note:"Codo pegado al cuerpo, a 90 grados. Discos en un solo extremo",
    segs:[{a:0,b:.45,from:0,to:1,txt:"Gira despacio hacia un lado"},{a:.45,b:.5,from:1,to:1,txt:"Pausa"},
          {a:.5,b:.95,from:1,to:0,txt:"Y hacia el otro"},{a:.95,b:1,from:0,to:0,txt:"Pausa"}],
    draw:(p,dir) => { const C0 = [134,104], th = -90 + lerp(-70,70,p), end = P(C0,th,56);
      return Rc(14,14,62,150,26,"sup") + Ln([74,32],[88,90],"bd",14) + Ln([88,90],[124,102],"bd",16) +
        arrowFor(C0,74,-160,-20,dir) + Ln(P(C0,th+180,14),end,"eq",7) + Ln(P(end,th+90,14),P(end,th-90,14),"eq",15) + Ci(C0,12,"bdf"); } },
  radial: { name:"Desviación radial", dur:5, thumbT:.2, note:"De pie, brazo al costado, discos solo adelante. Solo se mueve la muñeca",
    segs:std4("Levanta el extremo con discos","Arriba","Baja despacio","Abajo"),
    draw:(p,dir) => { const F = [74,94], a = lerp(35,-25,p), end = P(F,a,62);
      return standing() + Ln([66,40],[73,88],"bd",13) + arrowFor(F,78,35,-25,dir) +
        Ln(P(F,a+180,8),end,"eq",7) + Ln(P(end,a-90,13),P(end,a+90,13),"eq",14) + Ci(F,9,"bdf"); } },
  grip: { name:"Agarre con toalla", dur:7, thumbT:.3, note:"Toalla de mano enrollada. Vista desde el dorso de la mano",
    segs:[{a:0,b:.06,from:0,to:1,txt:"Aprieta"},{a:.06,b:.78,from:1,to:1,lin:true,txt:(k,s)=>"Aprieta: "+count(k,s,5)},
          {a:.78,b:1,from:1,to:0,txt:"Suelta despacio"}],
    draw:(p) => { const th = f1(15-3*p); let out = Rc(88,116,48,40,10,"bdf") + Rc(40,f1(70-th),144,f1(2*th),th,"eqp") + '<circle cx="172" cy="70" r="'+f1(th*.5)+'" class="eq" stroke-width="3"/>' + Rc(82,60,60,66,18,"bdf");
      [83,98,113,128].forEach((x,i) => { out += Rc(x,34+7*p+(i===0||i===3?4:0),13,40,6.5,"bdf"); });
      return out + Ln([86,112],[68,88-4*p],"bd",14); } },
  fingext: { name:"Extensión de dedos contra la otra mano", dur:5, thumbT:.25, note:"La otra mano rodea las puntas de los dedos",
    segs:std4("Abre los dedos contra la otra mano","Abiertos","Cierra despacio","Cerrados"),
    draw:(p) => { const bases = [[96,100],[108,98],[120,98],[132,100]], cl = [14,5,-5,-14], op = [-24,-8,8,24];
      let out = Rc(86,94,56,70,16,"bdf"); const mids = [];
      bases.forEach((b,i) => { const ang = -90 + lerp(cl[i],op[i],p); out += Ln(b,P(b,ang,46),"bd",11); mids.push(P(b,ang,44)); });
      const tb = [90,124]; out += Ln(tb,P(tb,-90+lerp(20,-52,p),34),"bd",12);

async function hydrateMedia(root){

  const need = [...new Set(els.map(el => el.dataset.mpath).filter(p => !urlCache[p] || urlCache[p].exp < Date.now()))];

      if (!error && data) data.forEach(d => { if (d && d.signedUrl && d.path) urlCache[d.path] = {url: d.signedUrl, exp: Date.now() + 3300e3}; });
    } catch(e){}

function authErr(e){
  const m = String((e && e.message) || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (m.includes("already registered") || m.includes("already been registered") || m.includes("already exists")) return "Ese correo ya tiene cuenta. Usa Entrar.";
  if (m.includes("not confirmed")) return "Falta confirmar el correo: abre el link que te llegó y luego dale Entrar.";
  if (m.includes("password") && (m.includes("6") || m.includes("short") || m.includes("weak"))) return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("signup") && (m.includes("not allowed") || m.includes("disabled"))) return "La creación de cuentas está apagada en Supabase.";
  if (m.includes("rate limit")) return "Demasiados intentos seguidos. Espera unos minutos.";
  if (m.includes("email") && m.includes("invalid")) return "Revisa el correo, parece que tiene un error.";
  return "No se pudo: " + ((e && e.message) || "error desconocido");
}

function habitStats(days){
  const today = new Date(); let ice = 0, heat = 0, bsum = 0, bn = 0, pl = [], prr = [];
  for (let i = 0; i < days; i++){ const l = state.logs[key(addDays(today, -i))]; if (!l) continue;
    if (l.ice) ice++; if (l.heat) heat++; if (typeof l.breaks === "number" && l.breaks > 0){ bsum += l.breaks; bn++; }
    if (typeof l.painL === "number") pl.push(l.painL); if (typeof l.painR === "number") prr.push(l.painR); }
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0)/a.length : null;
  return {ice, heat, breaks: bn ? bsum/bn : null, painL: avg(pl), painR: avg(prr)};
}

    s.items.map(exById).filter(Boolean).forEach(e => { const lt = lastTime(e); t += "- " + e.name + (rx(e) ? ": " + rx(e) : "") + (e.confirmed ? "" : " (por confirmar)") + (lt && lt.reps.length ? ". La última vez hice " + fmtReps(e, lt.reps) + (e.perArm ? " (der/izq)" : "") + (lt.load ? " con " + lt.load : "") : "") + "\n"; });

async function handleFile(file, exId){
  const btn = $("[data-addmedia]");
  const say = (t, err) => { const s = $("#mstatus"); if (s){ s.textContent = t; s.classList.toggle("err", !!err); } };
  if (btn) btn.disabled = true;
  try {
    let blob = file, type, kind;
    const isVid = /^video\//.test(file.type) || /\.(mp4|mov|m4v|webm)$/i.test(file.name || "");
    if (/^image\//.test(file.type)){ kind = "image"; say("Preparando la foto…"); blob = await shrinkImage(file); type = blob.type || "image/jpeg"; }
    else if (isVid){
      kind = "video";
      if (file.size > 10*MB){ say("Comprimiendo el video: 0 %"); blob = await compressVideo(file, p => say("Comprimiendo el video: " + Math.round(p*100) + " %")); }
      type = /webm/i.test(blob.type) ? "video/webm" : "video/mp4";
    } else throw {code:"unsupported_type"};
    if (blob.size > 45*MB) throw {code:"too_large"};
    if (!canMedia()) throw {code: "upstream"};
    say(kind === "video" ? "Subiendo el video…" : "Subiendo la foto…");
    const ext = {"video/webm":"webm","video/mp4":"mp4","image/png":"png","image/webp":"webp","image/gif":"gif"}[type] || "jpg";
    const path = session.user.id + "/" + Date.now() + "-" + uid() + "." + ext;
    const up = await sb.storage.from("media").upload(path, blob, { contentType: type, upsert: false });
    if (up.error) throw {code: storageErr(up.error)};
    const r = {id: path};
    const e = exById(exId);
    if (!e){ try { await sb.storage.from("media").remove([path]); } catch(x){} return; }
    e.media = e.media || []; e.media.push({id: r.id, kind, d: key(new Date())}); save();
    toast(kind === "video" ? "Video guardado" : "Foto guardada");
    if (detailId === exId && sheetOpen) drawDetail();
  } catch(err){ say(mediaError(err), true); if (btn) btn.disabled = false; }
}
